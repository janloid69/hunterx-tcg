<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: on iPhones opened from the home screen, the page reports
         the status bar's height so buttons can stay below it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Track your cards in pesos, scan cards, and trade with the HunterX Discord community." />
    <meta name="theme-color" content="#0E0E10" />
    <meta name="color-scheme" content="dark" />

    <!-- Link previews on Facebook, X, Discord and Messenger -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HunterX TCG" />
    <meta property="og:title" content="HunterX TCG" />
    <meta property="og:description" content="Free for Filipino collectors: track your cards in pesos, scan cards, check peso prices, and buy and sell with the HunterX Discord community." />
    <meta property="og:url" content="https://hunterx-tcg.netlify.app/" />
    <meta property="og:image" content="https://hunterx-tcg.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HunterX TCG: your cards in pesos. Scan, price, buy and sell." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Add to home screen. In the page itself (not added by the app later) so
         iPhones read them when HunterX is saved and every time it opens. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HunterX" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Dark from the first moment, so there's no white flash while the app loads */
      html,
      body {
        height: 100%;
        background-color: #0E0E10;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> HunterX TCG needs JavaScript turned on. </noscript>
    <div id="root"></div>
  </body>
</html>
