# HunterX moved to Cloudflare Pages: https://hunterx-tcg.pages.dev (published by
# .github/workflows/deploy-site.yml). Netlify now only forwards the old
# hunterx-tcg.netlify.app links there, to the same page.
[build]
  base = "netlify-forward"
  publish = "."
  command = "echo Forwarding to hunterx-tcg.pages.dev"
  # Each Netlify deploy costs credits, so only rebuild when the forwarding changes.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[[redirects]]
  from = "/*"
  to = "https://hunterx-tcg.pages.dev/:splat"
  status = 301
  force = true
