name: Sync card data

# Copies Pokémon, One Piece and Riftbound card data into Supabase every night
# (about 1:47 AM Philippine time). You can also run it by hand from the
# Actions tab. Needs these repository secrets:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and optionally POKEMONTCG_API_KEY.

on:
  schedule:
    - cron: '47 17 * * *'
  workflow_dispatch:
    inputs:
      games:
        description: 'Games to sync (space separated: pokemon one-piece riftbound). Empty = every game shown on the site.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sync cards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: node scripts/sync-cards/index.mjs ${{ github.event.inputs.games }}
