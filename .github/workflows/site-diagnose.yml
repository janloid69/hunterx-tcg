name: Diagnose live site (temporary)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/site-diagnose.yml']

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect fonts on the live site
        run: |
          note() { printf '::notice title=%s::%s\n' "$1" "$(printf '%s' "$2" | tr '\n' ' ' | cut -c1-900)"; }
          site=https://hunterxtcg.com
          curl -sSL "$site/" -o home.html
          note "index scripts" "$(grep -oE '<script[^>]*src="[^"]+"' home.html | head -5)"
          note "index headers" "$(curl -sSIL "$site/" | grep -iE '^(HTTP|cache-control|cf-cache-status|etag|age)' | tr -d '\r')"
          for js in $(grep -oE 'src="[^"]+\.js"' home.html | sed -E 's/src="([^"]+)"/\1/'); do
            curl -sSL "$site$js" -o bundle.js
            note "bundle $js" "size=$(wc -c < bundle.js) node_modules=$(grep -o 'node_modules' bundle.js | wc -l) vendor=$(grep -o 'assets/vendor' bundle.js | wc -l)"
            note "bundle headers" "$(curl -sSIL "$site$js" | grep -iE '^(HTTP|cache-control|cf-cache-status|etag|age)' | tr -d '\r')"
            note "Anton in bundle" "$(grep -oE '.{0,160}Anton_400Regular.{0,160}' bundle.js | head -3)"
            note "httpServerLocation samples" "$(grep -oE 'httpServerLocation:\"[^\"]+\"' bundle.js | sort -u | head -8)"
            loc=$(grep -oE 'httpServerLocation:"[^"]*anton[^"]*"' bundle.js | head -1 | sed -E 's/.*:"([^"]+)"/\1/')
            if [ -n "$loc" ]; then
              for f in "$loc/Anton_400Regular.ttf" ; do
                note "font $f" "$(curl -sSIL "$site$f" | grep -iE '^(HTTP|content-type)' | tr -d '\r')"
              done
            fi
          done
          note "font file listing guess" "$(curl -sSIL "$site/assets/vendor/@expo-google-fonts/anton/400Regular/Anton_400Regular.ttf" | grep -iE '^(HTTP|content-type)' | tr -d '\r')"
