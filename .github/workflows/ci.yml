name: Checks

# Runs on every push and pull request:
#   - website: installs packages, type-checks, and builds the website
#   - database: applies the migrations to Postgres, runs the security checks,
#     the card mapping tests, and the Discord bot against PostgREST
#   - bot: the Discord bot's own tests

on:
  push:
  pull_request:

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check package versions match Expo SDK
        run: npx expo install --check
      - run: npx tsc --noEmit
      - name: Card number reader tests
        run: node --test --experimental-strip-types tests/*.test.mjs
      - name: Build website
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npx expo export --platform web
      - name: Home-screen files are in the build
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-512.png
          test -f dist/icons/apple-touch-icon.png
          test -f dist/og-image.png
      - name: Website opens in Chrome (signed out, slow fonts, signed in)
        env:
          PLAYWRIGHT_MODULE: /tmp/playwright/node_modules/playwright-core/index.mjs
          CHROME_CHANNEL: chrome
        run: |
          npm install --prefix /tmp/playwright --no-audit --no-fund playwright-core@1.63.0
          node tests/site-smoke.mjs dist
      - uses: actions/upload-artifact@v6
        with:
          name: website
          path: app/dist
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Supabase's "Automatically expose new tables" setting: both must pass.
        expose_new_tables: [false, true]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply migration
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_stub_supabase.sql
          if [ "${{ matrix.expose_new_tables }}" = "true" ]; then
            psql -v ON_ERROR_STOP=1 -q -f supabase/tests/01_expose_new_tables.sql
          fi
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Card sync rows fit the schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: node --test scripts/sync-cards/test/*.test.mjs
      - name: Security and schema checks
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/10_schema_test.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/20_marketplace_test.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/30_discord_bot_test.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/40_price_guide_test.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/50_launch_test.sql
      - name: Discord bot end-to-end check (through PostgREST, like Supabase)
        env:
          PGRST_DB_URI: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ -C /tmp
          POSTGREST_BIN=/tmp/postgrest discord-bot/test/e2e/run.sh

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
