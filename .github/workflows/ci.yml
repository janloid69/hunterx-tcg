name: Checks

# Runs on every push and pull request:
#   - website: installs packages, type-checks, and builds the website
#   - database: applies the migration to Postgres and runs the security checks
#   - card sync: runs the card mapping tests

on:
  push:
  pull_request:

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check package versions match Expo SDK
        run: npx expo install --check
      - run: npx tsc --noEmit
      - name: Build website
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npx expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: app/dist
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_stub_supabase.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Card sync rows fit the schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: node --test scripts/sync-cards/test/*.test.mjs
      - name: Security and schema checks
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/10_schema_test.sql
