name: Publish website

# Builds the website and publishes it on Cloudflare Pages (free: unlimited
# visitors and bandwidth) every time the checks pass on main. You can also run
# it by hand from the Actions tab.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# The first run creates the Pages project. The run's summary shows the address.

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-website
  cancel-in-progress: false

env:
  PROJECT: hunterx-tcg
  WRANGLER: wrangler@4.150.0
  # The site's own domain (connected under Workers & Pages → hunterx-tcg → Custom domains).
  # hunterx-tcg.pages.dev and www forward here.
  DOMAIN: https://hunterxtcg.com

jobs:
  publish:
    # Only after the checks passed for a push to main (or when run by hand).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Publish website::Not published: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      # The public Supabase settings come from app/.env.production.
      - name: Build website
        if: env.SKIP != 'true'
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx expo export --platform web
          # Without a 404.html, Cloudflare Pages sends every unknown path to
          # index.html, which is what a single-page app needs.
          rm -f dist/404.html
          test -f dist/index.html

      - name: Create the Pages project (first run only)
        if: env.SKIP != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes "$WRANGLER" pages project list 2>/dev/null | grep -q " $PROJECT "; then
            echo "The $PROJECT project already exists."
          else
            npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch=main
          fi

      - name: Publish
        if: env.SKIP != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          npx --yes "$WRANGLER" pages deploy app/dist --project-name="$PROJECT" --branch=main --commit-hash="$SHA" --commit-dirty=true | tee deploy.log
          # Before a domain is connected, check Cloudflare's own address instead:
          # "https://abc123.hunterx-tcg.pages.dev" -> "https://hunterx-tcg.pages.dev"
          site="$DOMAIN"
          if [ -z "$site" ]; then
            site=$(grep -oE 'https://[a-z0-9]+\.[a-z0-9-]+\.pages\.dev' deploy.log | head -1 | sed -E 's#https://[a-z0-9]+\.#https://#')
          fi
          echo "SITE=${site:-https://$PROJECT.pages.dev}" >> "$GITHUB_ENV"

      - name: Check the live site
        if: env.SKIP != 'true'
        run: |
          # Give Cloudflare a moment, then check the home page, a deep link and the preview image.
          for i in $(seq 1 40); do
            if curl -sfL "$SITE/" -o home.html && grep -q 'id="root"' home.html; then break; fi
            sleep 6
          done
          grep -q 'id="root"' home.html
          curl -sfL "$SITE/community" | grep -q 'id="root"'
          curl -sfIL "$SITE/og-image.png" | grep -qi 'content-type: image/png'
          curl -sfL "$SITE/manifest.webmanifest" | grep -q '"start_url"'
          echo "::notice title=Published::The website is live at $SITE"
